    <animate attributeName="width" from="0" to="65.0" begin="0.46s" dur="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text class="meta" x="516" y="147" text-anchor="end">5 repos</text>
