    <animate attributeName="width" from="0" to="26.0" begin="0.73s" dur="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text class="meta" x="516" y="237" text-anchor="end">2 repos</text>
</g>
<g class="row" style="animation-delay:0.72s">
  <text class="name" x="24" y="267">Java</text>
