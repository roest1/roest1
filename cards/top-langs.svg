    <animate attributeName="width" from="0" to="65.0" begin="0.37s" dur="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text class="meta" x="516" y="117" text-anchor="end">5 repos</text>
</g>
